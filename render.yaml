services:
  - type: web
    name: schedulr-iq-iiit-surat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SOLVER_MODE
        value: lns
      - key: SOLVER_WORKERS
        value: "1"
      - key: SCHEDULR_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        value: viewer
      - key: VIEWER_PASSWORD
        sync: false
